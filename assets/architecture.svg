  <rect x="940" y="32" width="220" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
  <text x="1050" y="49" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">ZERO EXTERNAL RUNTIME DEPS</text>

  <!-- Column 1: Paperclip Core -->
  <rect x="35" y="95" width="345" height="535" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
  <rect x="35" y="95" width="345" height="38" rx="10" fill="url(#blueGlow)"/>
  <rect x="35" y="125" width="345" height="8" fill="#161b22"/>
  <line x1="35" y1="133" x2="380" y2="133" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#58a6ff" letter-spacing="0.5">1. PAPERCLIP ECOSYSTEM</text>
  <rect x="290" y="105" width="75" height="20" rx="10" fill="#1f6feb" fill-opacity="0.2"/>
  <text x="327" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#79c0ff" text-anchor="middle">SERVER / UI</text>

  <!-- Paperclip Cards -->
  <rect x="50" y="150" width="315" height="85" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Kanban Board &amp; Issue Graph</text>
  <text x="65" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Hierarchical cards: Agent tasks &amp; Board steps</text>
  <text x="65" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Sub-card blocker relations (unresolved dependencies)</text>
  <text x="65" y="226" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#58a6ff">GET /api/issues/:id | PATCH /api/issues</text>

  <rect x="50" y="250" width="315" height="85" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">REST API &amp; Activity Feed</text>
  <text x="65" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Event streams: agent hire, status, comments</text>
  <text x="65" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Run lifecycle: execution transcripts &amp; tokens</text>
  <text x="65" y="326" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#58a6ff">POST /api/runs | /api/activity/feed</text>

  <rect x="50" y="350" width="315" height="75" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Wake Interception (No Rogue Headless)</text>
  <text x="65" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Paperclip automatic wakes halted cleanly</text>
  <text x="65" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Parked into backlog: "Waiting for Desktop turn"</text>

  <rect x="50" y="440" width="315" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">SPA Hot-Fixes (paperclip-ui-fixes)</text>
  <text x="65" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Import map hash query (?cdpc=) defeats cache</text>
  <text x="65" y="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Halts spinning icons; isolates setup wizard</text>

  <rect x="50" y="535" width="315" height="80" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="65" y="557" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Desktop Turn Wake</text>
  <text x="65" y="577" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Triggered by user prompt in Claude Desktop</text>
  <text x="65" y="595" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Maps interactive Desktop session into Run ID</text>

  <!-- Column 2: Native Adapter & Supervision Engine -->
  <rect x="410" y="95" width="375" height="535" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
  <rect x="410" y="95" width="375" height="38" rx="10" fill="url(#purpleGlow)"/>
  <rect x="410" y="125" width="375" height="8" fill="#161b22"/>
  <line x1="410" y1="133" x2="785" y2="133" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#bc8cff" letter-spacing="0.5">2. NATIVE ADAPTER &amp; IPC ENGINE</text>
  <rect x="690" y="105" width="80" height="20" rx="10" fill="#8957e5" fill-opacity="0.2"/>
  <text x="730" y="119" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d2a8ff" text-anchor="middle">NODE.JS 22+</text>

  <!-- Adapter Sub-blocks -->
  <rect x="425" y="150" width="345" height="85" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">claude_local Adapter (index.mjs)</text>
  <text x="440" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Replaces Paperclip built-in Claude type</text>
  <text x="440" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• testEnvironment() verifies local Claude Code &amp; auth</text>
  <text x="440" y="226" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#bc8cff">Zero npm runtime deps (pure node:fs, node:http)</text>

  <rect x="425" y="250" width="345" height="95" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Turn Hooks Framework (hooks/)</text>
  <text x="440" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• SessionStart: Injects $PAPERCLIP_RUN_ID &amp; API keys</text>
  <text x="440" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• UserPromptSubmit: Binds user prompt to Paperclip Run</text>
  <text x="440" y="328" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Stop / quietEnding: Closes run on turn completion</text>

  <rect x="425" y="360" width="345" height="75" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Board Hold Supervisor (board-hold.mjs)</text>
  <text x="440" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Detects unauthorized card closures in event feed</text>
  <text x="440" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Re-opens board blocker cards &amp; sets agent to blocked</text>

  <rect x="425" y="450" width="345" height="75" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="472" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">House Setup (house-setup.mjs)</text>
  <text x="440" y="492" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Seeds templates/org/CLAUDE.md &amp; FACTS.md</text>
  <text x="440" y="510" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Provisions Chief of Staff with Opus 5.5 max effort</text>

  <rect x="425" y="540" width="345" height="75" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="440" y="562" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">CLI Bridge (paperclip-card.mjs)</text>
  <text x="440" y="582" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• --new: Creates card &amp; ties current turn's run</text>
  <text x="440" y="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• --board: Spawns human approval card with blocker</text>

