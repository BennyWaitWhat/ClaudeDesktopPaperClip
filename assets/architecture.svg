  <!-- Container Box -->
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="15" y="15" width="1170" height="60" rx="14" fill="#161b22"/>
  <rect x="15" y="60" width="1170" height="15" fill="#161b22"/>
