  <text x="548" y="671" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">Claude Desktop Runtime &amp; Security Fence</text>

  <rect x="815" y="658" width="16" height="16" rx="4" fill="#f85149"/>
  <text x="838" y="671" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e">Destructive Mutation Gatekeeper</text>

