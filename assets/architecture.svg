  <text x="845" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Scans AppData / Local / packaged binary paths</text>
  <text x="845" y="210" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Reads ccd-session-presets.json session registry</text>
  <text x="845" y="226" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#3fb950">desktop.mjs | Live handle resolution</text>

  <rect x="830" y="250" width="320" height="85" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="845" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Dedicated Org Agent Sessions</text>
  <text x="845" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• One conversation per agent in org folder</text>
  <text x="845" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Loaded from .claude/agents/&lt;agent&gt;.md</text>
  <text x="845" y="326" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#3fb950">Chief of Staff + Specialists in Desktop UI</text>

  <rect x="830" y="350" width="320" height="95" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="845" y="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Security Fence: WORDS_ONLY</text>
  <text x="845" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• PreToolUse: intercepts Gmail / Drive / Calendar</text>
  <text x="845" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Blocks destructive calls without user 24h approval</text>
  <text x="845" y="428" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#f85149">google-tools.mjs --benny-said token gate</text>

  <rect x="830" y="460" width="320" height="75" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="845" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Credential Refresh Keep-Alive</text>
  <text x="845" y="502" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Renews 8h Claude credentials token in background</text>
  <text x="845" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Auto-clears stale reboot locks in .credentials.json</text>

  <rect x="830" y="550" width="320" height="65" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="845" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Desktop UI Tools &amp; MCP</text>
  <text x="845" y="592" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">• Native MCP tools, file system access, terminal</text>
  <text x="845" y="606" font-family="Consolas, SFMono-Regular, monospace" font-size="10" fill="#3fb950">mcp__ccd_session_mgmt__send_message</text>

